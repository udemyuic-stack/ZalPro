name: zalpro

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api: &api
  image: zalpro-api:latest
  build:
    context: ../src/api
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://zalpro:${POSTGRES_PASSWORD}@db:5432/zalpro
  networks: [net]
  logging: *logging

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zalpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zalpro
    command: >-
      postgres
      -c shared_buffers=768MB
      -c effective_cache_size=2GB
      -c max_connections=50
      -c timezone=UTC
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zalpro -d zalpro"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [net]
    logging: *logging

  migrate:
    <<: *api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [net]
    logging: *logging

  backup:
    <<: *api
    profiles: ["tools"]
    restart: "no"
    command: ["python", "-m", "scripts.backup", "dump"]
    depends_on:
      db:
        condition: service_healthy

networks:
  net:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
